name: Apex CI Pipeline

on:
  push:
    branches:
      - main


permissions:
  contents: read

env:
  ACR_NAME: apexregistry001
  ACR_LOGIN_SERVER: apexregistry001.azurecr.io
  IMAGE_NAME: apex-app
  APP_DIR: apex-python-monolith

jobs:
  ci:
    name: Test, Build and Push
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Source Code
      # ==========================================
      - name: Checkout Code
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup Python
      # ==========================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"


      # ==========================================
      # 3. Install Dependencies
      # ==========================================
      - name: Install Dependencies
        working-directory: ${{ env.APP_DIR }}
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest


      # ==========================================
      # 4. Run Tests
      # ==========================================
      - name: Run Tests
        working-directory: ${{ env.APP_DIR }}
        run: |
          pytest


      # ==========================================
      # 5. Login to Azure
      # ==========================================
      - name: Login to Azure
        if: github.event_name == 'push'
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}


      # ==========================================
      # 6. Login to Azure Container Registry
      # ==========================================
      - name: Login to ACR
        if: github.event_name == 'push'
        run: |
          az acr login --name $ACR_NAME


      # ==========================================
      # 7. Build Docker Image
      # ==========================================
      - name: Build Docker Image
        if: github.event_name == 'push'
        run: |
          docker build \
            --platform linux/amd64 \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }} \
            -t $ACR_LOGIN_SERVER/$IMAGE_NAME:latest \
            ./$APP_DIR


      # ==========================================
      # 8. Push Image to ACR
      # ==========================================
      - name: Push Docker Image to ACR
        if: github.event_name == 'push'
        run: |
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:latest


      # ==========================================
      # 9. Display Published Image
      # ==========================================
      - name: Show Image
        if: github.event_name == 'push'
        run: |
          echo "Image pushed successfully:"
          echo "$ACR_LOGIN_SERVER/$IMAGE_NAME:${{ github.sha }}"